name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome and matching ChromeDriver
        uses: step-security/setup-chrome@v2
        with:
          install-chromedriver: true
          install-dependencies: true

      - name: Install Xvfb
        run: sudo apt-get update -y && sudo apt-get install -y xvfb

      - name: Run Robot Framework UI tests
        run: >
          xvfb-run --auto-servernum
          robot -d results
          -v 'CHROME_OPTIONS:add_argument("--headless=new"); add_argument("--window-size=1920,1080")'
          tests/

      - name: Summarise failures
        if: failure()
        run: |
          {
            echo '## Robot Framework failures'
            echo
            echo '```'
            python -c "
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('results/output.xml'):
              for test in ET.parse(f).getroot().iter('test'):
                  st = test.find('status')
                  if st is not None and st.get('status') == 'FAIL':
                      print('FAIL:', test.get('name'))
                      print('   ', (st.text or '').strip()[:500])
          " || echo 'no output.xml produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-results
          path: results/
