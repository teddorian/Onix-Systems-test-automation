name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome and matching ChromeDriver
        uses: step-security/setup-chrome@v2
        with:
          install-chromedriver: true
          install-dependencies: true

      - name: Install Xvfb
        run: sudo apt-get update -y && sudo apt-get install -y xvfb

      - name: Run Robot Framework UI tests
        run: xvfb-run --auto-servernum robot -d results tests/

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-results
          path: results/
